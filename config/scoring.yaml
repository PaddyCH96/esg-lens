# ESG Lens scoring configuration - versioned, hashed, stamped onto every esg_scores row
# Source: docs/scoring_methodology.md §2, §3, §5, §6

version: "0.2.0"

# ── Gates & thresholds ──────────────────────────────────────────────────
# FinBERT-ESG relevance threshold, per doc_type (D-2-01).
# Headlines are short and out-of-domain for a model trained on corporate-report sentences, so
# softmax confidence runs systematically lower for the same true relevance: at a uniform 0.60,
# 8 of 50 real headlines fell below threshold, two of them genuine ESG lawsuits at 0.45/0.48.
# Filing sections keep 0.60 — long-form relevant text genuinely does score higher.
tau:
  news: 0.45
  filing_section: 0.60
  press_release: 0.45
min_evidence: 1.0               # Σ w_ev gate per pillar (§6.1)
max_age_days: 730               # documents older than this are excluded (§5)
pen_cap: 40                     # max controversy penalty per pillar (§6.1)

# Controversy severity multipliers k[ctrl] (§6.1)
k:
  1: 1.0
  2: 4.0
  3: 12.0

# Recency half-lives in days (§5)
half_life:
  news: 90
  filing: 365
  filing_section: 365
  press_release: 90

# ── Category → pillar map + within-pillar materiality (§2) ─────────────
# w_cat sums to 1.0 per pillar. Non-ESG is not listed (dropped at gate 2).
category_weights:
  Climate Change: 0.45
  Natural Capital: 0.25
  Pollution & Waste: 0.30
  Human Capital: 0.40
  Product Liability: 0.35
  Community Relations: 0.25
  Corporate Governance: 0.45
  Business Ethics & Values: 0.55

category_to_pillar:
  Climate Change: E
  Natural Capital: E
  Pollution & Waste: E
  Human Capital: S
  Product Liability: S
  Community Relations: S
  Corporate Governance: G
  Business Ethics & Values: G

# ── Pillar weights in composite, sector-overridable (§2) ───────────────
pillar_weights:
  default: {E: 0.34, S: 0.33, G: 0.33}
  overrides:
    Energy: {E: 0.50, S: 0.25, G: 0.25}
    Utilities: {E: 0.45, S: 0.25, G: 0.30}
    Financial Services: {E: 0.15, S: 0.25, G: 0.60}
    Technology: {E: 0.25, S: 0.35, G: 0.40}
    Healthcare: {E: 0.20, S: 0.45, G: 0.35}
    Consumer Defensive: {E: 0.35, S: 0.40, G: 0.25}

# ── Polarity damping (§3) ───────────────────────────────────────────────
# Positive sentiment is scaled by 0.6 — a 40% damping — because favourable
# coverage is frequently company-sourced PR. Controversy overrides sentiment.
sentiment_damping: 0.6
controversy_sentiment_weight: 0.3

# ── Confidence formula weights (§6.3) ──────────────────────────────────
confidence_weights:
  doc_count: 0.4
  evidence_weight: 0.3
  pillar_coverage: 0.3
confidence_doc_denominator: 30
confidence_evidence_denominator: 10

# ── Misc ────────────────────────────────────────────────────────────────
scoring:
  # NOT authoritative for NLP inference. `nlp.batch_size` below is what nlp/registry.py reads;
  # this key is retained for Phase 3 scoring batches only. If they ever disagree, nlp wins for
  # anything touching a transformer pipeline.
  batch_size: 16
  model_version: "finbert-esg-9cat@v1|prosus-finbert@v1|lex@2026-09b"

# ── NLP pipeline (Phase 2) ─────────────────────────────────────────────
# Every threshold the NLP pipeline uses lives here. A magic number in src/ is a bug
# (Phase 0 success criterion 4).
nlp:
  batch_size: 16                     # HF pipeline batch size — authoritative for inference
  near_duplicate_jaccard: 0.70       # token-set Jaccard over normalised titles (D-2-02).
                                     # Tuned on the real MSFT corpus: 7 clusters / 12 docs at
                                     # 100% precision. Lower values start merging distinct
                                     # stories (a genuinely distinct MSFT pair scores 0.46).
  max_sentences_per_section: 400     # DoS guard on a pathological 10-K (T-02-04)
  min_sentence_chars: 25             # below this is EDGAR table furniture, not a sentence
  min_alpha_tokens_per_sentence: 4   # ditto — drops "| 1,234 | 5,678 |" rows
  sentiment_label_band: 0.15         # |score| below this reads as neutral (cosmetic label only)
  min_aliases_for_entity_gate: 1     # fewer known aliases than this → gate fails open
  max_controversy_terms: 20          # cap on the persisted audit-trail term list
  entity_match_ratio: 0.85           # fuzzy ORG↔alias match floor for the entity gate (02-02).
                                     # It lives here rather than as a "structural constant" in
                                     # entity.py because a magic number does not stop being one
                                     # by being called structural.
