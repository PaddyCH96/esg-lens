# Controversy lexicon (§4) - spaCy PhraseMatcher over lemmas
# Severity 3 severe/systemic, 2 material, 1 minor/allegation, 0 none (implicit)
# Negation guard demotes severity by 1: cleared of, dismissed, settled without, charges dropped

version: "lex@2026-09b"

# Negation phrases — if any appears within `window` tokens on EITHER SIDE of a trigger match,
# severity is demoted by 1 (floor 0). The window is SYMMETRIC, not "4 tokens before": the
# commonest real construction is "the lawsuit was dismissed", where the negator FOLLOWS the
# trigger. A stale comment on a rule that suppresses controversy signal is a future bug.
#
# Bare "dropped" was removed in lex@2026-09b. It lemmatises to "drop" and fired on
# "MSFT Stock Drop: ... Securities Fraud Class Action", silently demoting a tier-3 controversy
# on a price-movement headline. Only the constrained multi-token forms below survive.
negation_guard:
  phrases:
    - "cleared of"
    - "dismissed"
    - "settled without"
    - "charges dropped"
    - "drop charges"
    - "case dropped"
    - "dropped the lawsuit"
    - "dropped its lawsuit"
    - "lawsuit dropped"
    - "acquitted of"
    - "exonerated"
  window: 4

# Severity tiers - triggers are matched as lemma phrases (case-insensitive)
tiers:
  3:
    label: "severe"
    triggers:
      - "oil spill"
      - "bribery"
      - "fraud"
      - "child labor"
      - "child labour"
      - "fatality"
      - "fatalities"
      - "class action"
      - "criminal probe"
      - "criminal investigation"
      - "corruption"
      - "embezzlement"
      - "forced labor"
      - "forced labour"
      - "human trafficking"
      - "environmental disaster"
  2:
    label: "material"
    triggers:
      - "fine"
      - "penalty"
      - "penalties"
      - "lawsuit"
      - "recall"
      - "strike"
      - "investigation"
      - "data breach"
      - "layoff"
      - "layoffs"
      - "sanction"
      - "violation"
      - "non-compliance"
      - "discrimination"
      - "harassment"
      - "pollution"
      - "contamination"
  1:
    label: "minor"
    triggers:
      - "criticized"
      - "criticised"
      - "alleged"
      - "allegation"
      - "scrutiny"
      - "protest"
      - "complaint"
      - "downgrade"
      - "concern"
      - "controversy"
      - "backlash"
      - "criticism"
      - "accused"
