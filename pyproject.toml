[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-lens"
version = "0.1.0"
description = "Transparent, reproducible ESG signal aggregation for public equities"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.1",
    "pydantic==2.9.0",
    "pydantic-settings==2.4.0",
    "httpx==0.28.1",
    "hishel[httpx]==1.3.1",
    "tenacity==8.5.0",
    "structlog==24.4.0",
    "pyyaml==6.0.1",
    "yfinance==0.2.40",
    "pandas==2.2.2",
    "python-dotenv==1.0.1",
    "beautifulsoup4==4.15.0",
    "lxml",
]

[project.optional-dependencies]
nlp = [
    "transformers==4.57.6",
    "torch==2.6.0",
    "spacy==3.7.5",
]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.23.5",
    "respx==0.23.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
