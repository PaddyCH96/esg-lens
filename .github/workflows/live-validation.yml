name: ESG Lens live validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/live-validation.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DB_PATH: ${{ runner.temp }}/esg-lens.db
      CACHE_DIR: ${{ runner.temp }}/esg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and run offline suite
        run: |
          python -m pip install -e '.[dev]'
          USER_AGENT='ESG Lens offline tests (ci@esg-lens.test)' python -m pytest -q
      - name: Install CPU models
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e '.[nlp]'
          python -m spacy download en_core_web_sm
      - name: Run live API and benchmark
        env:
          SEC_CONTACT: ${{ vars.ESG_SEC_CONTACT }}
        run: |
          sec=()
          if [[ -n "$SEC_CONTACT" ]]; then
            echo "::add-mask::$SEC_CONTACT"
            export USER_AGENT="ESG Lens (${SEC_CONTACT})"
            sec+=(--edgar)
          fi
          uvicorn esg_lens.api.main:app --host 127.0.0.1 > validation-server.log 2>&1 &
          python -m scripts.live_validation --benchmark "${sec[@]}"
      - name: Upload observed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-validation
          path: |
            validation.json
            validation-server.log
          if-no-files-found: ignore
