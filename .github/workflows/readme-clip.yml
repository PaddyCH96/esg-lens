name: README demo clip
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/readme-clip.yml', 'docs/demo/prototype.webm']
permissions:
  contents: write
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create animated preview from the real recording
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -y -ss 4 -t 16 -i docs/demo/prototype.webm -vf "fps=8,scale=800:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" -loop 0 docs/demo/preview.gif
          test -s docs/demo/preview.gif
      - name: Commit preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/demo/preview.gif
          git diff --cached --quiet || git commit -m "docs: add animated prototype clip to README"
          git push
